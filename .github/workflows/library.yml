# Validate, pack reproducibly, and (on a tag) sign and publish the catalog.
#
# The validator is the main repository's own tooling, run from a sibling checkout: the
# format rules live in ONE place and cannot drift. Packing is deterministic (fixed mtimes,
# sorted entries) and this workflow keeps that honest by packing twice and comparing hashes.
name: library

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only by default: packing runs the main repository's tooling and must hold neither a
# write token nor a signing key. Only `publish` gets them.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Pinned: the validator and the signing script come from this exact claude-pet commit,
      # never from whatever its main holds at the time of the tag. Bump it on purpose.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: r45635/claude-pet
          ref: 310a5b640496ea9c2d5680175cd0ce7c3699fd8a
          path: claude-pet-main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      - name: Pack twice, compare (determinism), validate
        run: |
          node scripts/build-index.ts --main claude-pet-main
          (cd dist && shasum -a 256 *.claudepet | sort) > first.sum
          rm -rf dist
          node scripts/build-index.ts --main claude-pet-main
          (cd dist && shasum -a 256 *.claudepet | sort) > second.sum
          diff first.sum second.sum || { echo "::error::packing is not deterministic"; exit 1; }
          cat first.sum

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: catalog
          path: dist/*

  # Tag builds only: signs what `build` produced and publishes it, running no third-party
  # code. The keys live in the `release` environment, which only `v*` tags may deploy to.
  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: r45635/claude-pet
          ref: 310a5b640496ea9c2d5680175cd0ce7c3699fd8a
          path: claude-pet-main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog
          path: dist

      # The catalog's own key (claude-pet v0.5.5+ check index.json.catalog.sig); the release
      # key's index.json.sig stays for older apps until they have all updated.
      - name: Sign index.json
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$CATALOG_SIGNING_KEY" ] || { echo "::error::CATALOG_SIGNING_KEY secret is missing"; exit 1; }
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "::error::RELEASE_SIGNING_KEY secret is missing"; exit 1; }
          node claude-pet-main/scripts/sign-release.ts --catalog dist/index.json
          node claude-pet-main/scripts/sign-release.ts dist/index.json

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::bad tag $TAG"; exit 1; }
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" dist/* --clobber
